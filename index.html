<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dissecting Readings — The Price of Convenience</title>
<style>
:root{
  --pine:#2E1B33; --pine2:#5C3A6B; --mint:#EFE9F2; --paper:#FFFFFF;
  --amber:#C08A2B; --amber-d:#95691A;
  --ok:#2A6B55; --ok-bg:#E2EEE9; --no:#8A2F4A; --no-bg:#F7E8ED;
  --line:#D5C8DB; --muted:#6A5C72; --text:#1F1424;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--mint); color:var(--text);
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.55;
}
button{font-family:inherit; font-size:inherit; cursor:pointer}

/* ---------- header ---------- */
header{background:var(--pine); color:#F2ECF4; padding:14px 22px}
.hwrap{max-width:1180px; margin:0 auto; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand h1{margin:0; font-size:22px; letter-spacing:.3px}
.brand p{margin:2px 0 0; font-size:13px; color:#A796AE}
.hspace{flex:1}
.chip{background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.22); border-radius:20px;
  padding:5px 13px; font-size:13.5px; display:inline-flex; align-items:center; gap:7px; color:#F2ECF4}
.chip b{color:var(--amber); font-size:15px}
.hbtn{background:transparent; color:#F2ECF4; border:1px solid rgba(255,255,255,.3); border-radius:6px;
  padding:6px 12px; font-size:13px}
.hbtn:hover{background:rgba(255,255,255,.12)}
.hbtn.on{background:var(--amber); border-color:var(--amber); color:#2E2206; font-weight:600}

/* ---------- tabs ---------- */
nav.tabs{background:var(--pine2); padding:0 22px}
.twrap{max-width:1180px; margin:0 auto; display:flex; gap:2px; flex-wrap:wrap}
.tab{background:transparent; border:0; color:#AC9CB3; padding:11px 18px; font-size:14.5px; border-bottom:3px solid transparent}
.tab.active{color:#fff; border-bottom-color:var(--amber); font-weight:600}

/* ---------- layout ---------- */
main{max-width:1180px; margin:20px auto 60px; padding:0 22px; display:grid; grid-template-columns:250px 1fr; gap:20px}
@media(max-width:860px){ main{grid-template-columns:1fr} }

aside{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:14px; align-self:start}
aside h3{margin:0 0 4px; font-size:13px; text-transform:none; color:var(--muted); font-weight:600}
aside .ptitle{font-size:15px; font-weight:700; margin:0 0 10px; line-height:1.3}
.plist{display:flex; flex-direction:column; gap:5px}
.pitem{display:flex; align-items:center; gap:9px; text-align:left; background:#F4EFF6; border:1px solid var(--line);
  border-radius:7px; padding:8px 10px; font-size:14px; color:var(--text)}
.pitem:hover{border-color:var(--pine2)}
.pitem.active{background:var(--pine); color:#fff; border-color:var(--pine)}
.pitem .tag{flex:0 0 24px; height:24px; border-radius:5px; background:var(--pine2); color:#fff;
  display:grid; place-items:center; font-size:12.5px; font-weight:700}
.pitem.active .tag{background:var(--amber); color:#2E2206}
.pitem .done{margin-left:auto; color:var(--ok); font-weight:700}
.pitem.active .done{color:var(--amber)}
.bar{height:7px; background:#E2D7E7; border-radius:4px; overflow:hidden; margin-top:12px}
.bar span{display:block; height:100%; background:var(--amber); width:0%}
.barlbl{font-size:12px; color:var(--muted); margin-top:5px}

section.panel{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:0; overflow:hidden}
.phead{padding:16px 22px; border-bottom:1px solid var(--line)}
.phead .kicker{font-size:12.5px; color:var(--muted); margin:0}
.phead h2{margin:2px 0 0; font-size:20px}

.stages{display:flex; gap:6px; padding:12px 22px; border-bottom:1px solid var(--line); flex-wrap:wrap; background:#F6F2F8}
.stg{border:1px solid var(--line); background:#fff; border-radius:20px; padding:6px 14px; font-size:13.5px; color:var(--muted)}
.stg.active{background:var(--pine); border-color:var(--pine); color:#fff; font-weight:600}
.stg.ok{border-color:var(--ok); color:var(--ok)}
.stg.ok.active{background:var(--ok); border-color:var(--ok); color:#fff}

.body{padding:20px 22px}
.instr{background:#F0E9F3; border-left:4px solid var(--amber); padding:10px 14px; font-size:14.5px; margin:0 0 18px}
.instr b{color:var(--pine)}

.passage{font-family:Georgia,"Times New Roman",serif; font-size:17px; line-height:1.75; background:#FBFAF7;
  border:1px solid var(--line); border-radius:8px; padding:16px 18px}
.passage.small{font-size:16px}

/* sentence cards */
.scard{border:1px solid var(--line); border-radius:8px; margin-bottom:10px; overflow:hidden}
.scard .orig{font-family:Georgia,serif; font-size:16.5px; padding:12px 14px; background:#FBFAF7}
.scard .rev{display:none; border-top:1px dashed var(--line); padding:12px 14px; background:#F0E9F3}
.scard.open .rev{display:block}
.rev .lab{font-size:12px; color:var(--muted); font-weight:700; display:block; margin-bottom:2px}
.rev .simple{font-size:15.5px; margin:0 0 10px}
.rev .note{font-size:14px; color:var(--muted); margin:0; border-top:1px solid var(--line); padding-top:8px}
.mini{background:var(--pine2); color:#fff; border:0; border-radius:6px; padding:5px 12px; font-size:13px; margin:0 14px 12px}
.mini.ghost{background:#fff; color:var(--pine2); border:1px solid var(--pine2)}

/* questions */
.qcard{border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px}
.qcard .qnum{font-size:12px; color:var(--muted); font-weight:700}
.qcard .stem{font-size:16px; margin:3px 0 4px; font-weight:600}
.qcard .ctx{font-family:Georgia,serif; background:#FBFAF7; border-left:3px solid var(--line); padding:8px 12px;
  font-size:15.5px; margin:8px 0 12px; color:#3A2742}
.opt{display:block; width:100%; text-align:left; background:#fff; border:1px solid var(--line); border-radius:7px;
  padding:10px 13px; margin-bottom:7px; font-size:15px}
.opt:hover:not(:disabled){border-color:var(--pine2); background:#F6F2F8}
.opt:disabled{cursor:default}
.opt .k{display:inline-block; width:22px; font-weight:700; color:var(--muted)}
.opt.right{background:var(--ok-bg); border-color:var(--ok)}
.opt.right .k{color:var(--ok)}
.opt.wrong{background:var(--no-bg); border-color:var(--no)}
.opt.wrong .k{color:var(--no)}
.fb{display:none; margin-top:10px; padding:11px 13px; border-radius:7px; font-size:14.5px}
.fb.show{display:block}
.fb.good{background:var(--ok-bg); border:1px solid var(--ok)}
.fb.bad{background:var(--no-bg); border:1px solid var(--no)}
.fb b{display:block; margin-bottom:3px}
.ar{display:none; margin-top:8px; font-size:17px; direction:rtl; text-align:right; color:var(--pine2);
  background:#F0E9F3; border-radius:6px; padding:6px 10px}
.ar.show{display:block}
.pill{display:inline-block; background:var(--amber); color:#2E2206; font-weight:700; font-size:12px;
  border-radius:12px; padding:2px 9px; margin-left:8px}

.navrow{display:flex; gap:10px; align-items:center; padding:16px 22px; border-top:1px solid var(--line); background:#F6F2F8}
.btn{background:var(--pine); color:#fff; border:0; border-radius:7px; padding:10px 18px; font-size:15px; font-weight:600}
.btn:disabled{opacity:.4}
.btn.ghost{background:#fff; color:var(--pine); border:1px solid var(--pine)}
.btn.amber{background:var(--amber); color:#2E2206}
.navrow .sp{flex:1}
.hint{font-size:13.5px; color:var(--muted)}

/* progress page */
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
@media(max-width:760px){ .grid2{grid-template-columns:1fr} }
.stat{background:#F6F2F8; border:1px solid var(--line); border-radius:9px; padding:14px}
.stat .n{font-size:30px; font-weight:700; color:var(--pine)}
.stat .l{font-size:13px; color:var(--muted)}
.badge{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:20px;
  padding:7px 14px; margin:0 8px 8px 0; font-size:14px; background:#F4EFF6; color:var(--muted)}
.badge.won{background:var(--pine); color:#fff; border-color:var(--pine)}
.badge.won .ic{color:var(--amber)}
table.res{width:100%; border-collapse:collapse; font-size:14px; margin-top:8px}
table.res th,table.res td{border:1px solid var(--line); padding:6px 9px; text-align:left}
table.res th{background:#F0E9F3}

/* certificate */
#cert{display:none; background:#FBFAF7; border:3px double var(--pine); border-radius:8px; padding:28px; text-align:center; margin-top:18px}
#cert.show{display:block}
#cert h3{font-family:Georgia,serif; font-size:26px; margin:0 0 4px; color:var(--pine)}
#cert .nm{font-family:Georgia,serif; font-size:24px; border-bottom:1.5px solid var(--pine); display:inline-block;
  padding:0 26px 3px; margin:14px 0}
#cert input{font-family:Georgia,serif; font-size:20px; text-align:center; border:0; border-bottom:1.5px solid var(--pine);
  background:transparent; padding:4px; width:280px}
.sig{margin-top:20px; font-size:13.5px; color:var(--muted)}

footer{text-align:center; padding:18px; font-size:13px; color:var(--muted)}
.conf{position:fixed; width:9px; height:14px; top:-20px; z-index:99; pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg); opacity:.2}}
@media print{ header,nav,aside,.navrow,.tabs,.hbtn{display:none!important} main{display:block}
  body.certonly .phead, body.certonly .grid2, body.certonly table.res, body.certonly h3,
  body.certonly .badge, body.certonly .hint, body.certonly #printCert{display:none!important}
  body.certonly #cert{border:3px double #2E1B33; margin:0}
}

/* the sidebar only exists in Explain — every other phase gets the full width */
main.full{grid-template-columns:1fr}
/* ---------- 5E phase bar ---------- */
nav.tabs .tab .ph{display:inline-grid; place-items:center; width:21px; height:21px; border-radius:50%;
  background:rgba(255,255,255,.16); font-size:12px; font-weight:700; margin-right:8px; vertical-align:-4px}
nav.tabs .tab.active .ph{background:var(--amber); color:#2E2206}
.phasehead{background:var(--pine); color:#EDF4F2; padding:16px 22px; display:flex; align-items:center; gap:16px}
.phasehead .n{flex:0 0 46px; height:46px; border-radius:50%; background:var(--amber); color:#2E2206;
  display:grid; place-items:center; font-size:22px; font-weight:700}
.phasehead h2{margin:0; font-size:20px; color:#fff}
.phasehead p{margin:2px 0 0; font-size:13.5px; color:#A796AE}
.phasehead .mins{margin-left:auto; font-size:13px; color:#A796AE; white-space:nowrap}
.wordgrid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:0 0 18px}
@media(max-width:860px){ .wordgrid{grid-template-columns:repeat(3,1fr)} }
.wcard{background:#F6F2F8; border:1px solid var(--line); border-radius:8px; padding:10px 6px; text-align:center;
  font-size:14.5px; font-weight:600; color:var(--pine2)}
.wcard small{display:block; font-weight:400; font-size:12px; color:var(--muted); margin-top:2px}
textarea.tbox{width:100%; font-family:inherit; font-size:15px; border:1px solid var(--line); border-radius:8px;
  padding:10px 12px; resize:vertical; min-height:74px; background:#fff; color:var(--text)}
textarea.tbox:focus{outline:2px solid var(--pine2); outline-offset:1px}
.saved{font-size:13px; color:var(--ok); font-weight:600; margin-left:8px}
.goalpick{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 12px}
.gp{border:1px solid var(--line); background:#fff; border-radius:20px; padding:7px 14px; font-size:14px; color:var(--muted); text-align:left}
.gp.on{background:var(--pine); color:#fff; border-color:var(--pine); font-weight:600}
mark.hl{background:#FFE9AE; padding:1px 0}
.hlbar{display:flex; gap:8px; align-items:center; margin:0 0 10px; flex-wrap:wrap}
.para{margin:0 0 15px}
.para .plab{display:inline-block; background:var(--pine2); color:#fff; font-size:12px; font-weight:700;
  border-radius:4px; padding:1px 7px; margin-right:8px; font-family:"Segoe UI",sans-serif; vertical-align:2px}
.jobrow{display:grid; grid-template-columns:70px 1fr; gap:10px; align-items:start; margin-bottom:9px}
.jobrow .t{background:var(--pine2); color:#fff; border-radius:6px; text-align:center; padding:7px 0; font-weight:700; font-size:14px}
.mypred{background:#FBF2E0; border:1px solid #E3CB93; border-radius:8px; padding:11px 14px; margin:0 0 14px; font-size:14.5px}
.mypred b{display:block; font-size:12px; color:var(--amber-d); margin-bottom:3px}
/* ---------- diagram ---------- */
.dgwrap{display:grid; grid-template-columns:1fr 290px; gap:18px}
@media(max-width:860px){ .dgwrap{grid-template-columns:1fr} }
.parts{display:flex; flex-direction:column; gap:8px}
.part{border:1px solid var(--line); background:#fff; border-radius:8px; padding:11px 13px; font-size:15px; text-align:left}
.part:hover:not(:disabled){border-color:var(--pine2); background:#F6F2F8}
.part:disabled{background:var(--ok-bg); border-color:var(--ok); color:var(--ok); font-weight:600; cursor:default}
.dgbox{background:#FCFAFD; border:1px solid var(--line); border-radius:8px; padding:8px}
.selfgrid{display:grid; grid-template-columns:1fr auto; gap:10px 16px; align-items:center}
.stars{display:flex; gap:5px}
.star{width:30px; height:30px; border-radius:6px; border:1px solid var(--line); background:#fff; font-size:14px; color:var(--muted)}
.star.on{background:var(--amber); border-color:var(--amber); color:#2E2206; font-weight:700}
.bars5{display:flex; flex-direction:column; gap:9px; margin-top:4px}
.b5{display:grid; grid-template-columns:195px 1fr 54px; gap:10px; align-items:center; font-size:14px}
.fb b + br{display:none}
.b5 .track{height:14px; background:#D8E6E2; border-radius:7px; overflow:hidden}
.b5 .track i{display:block; height:100%; background:var(--pine2)}
.b5.weak .track i{background:var(--amber)}
</style>
</head>

  if(s===1) return DATA[p].sents.every((_,i)=>st.opened["s-"+p+"-"+i]);
  if(s===2) return DATA[p].vocab.every((_,i)=>{ const a=st.ans[key(p,"v",i)]; return a&&a.ok; });
  if(s===3){ const a=st.ans[key(p,"i")]; return a&&a.ok; }
  return DATA[p].checks.every((_,i)=>{ const a=st.ans[key(p,"c",i)]; return a&&a.ok; });
}
function points(){ let t=0; for(const k in st.ans){ const a=st.ans[k]; if(a.ok) t += a.tries===1?10:(a.tries===2?6:3); } return t + st.dg*5; }
function answered(){ let n=0; for(const k in st.ans) if(st.ans[k].ok) n++; return n; }
function totalItems(){ let n=0; DATA.forEach((_,p)=>n+=itemKeys(p).length); return n; }
function parasDone(){ let n=0; DATA.forEach((_,p)=>{ if(paraDone(p)) n++; }); return n; }
function firstTry(){ let n=0; for(const k in st.ans) if(st.ans[k].ok && st.ans[k].tries===1) n++; return n; }

/* ============================================================
   SHARED QUESTION RENDERING
   ============================================================ */
function optionsHTML(id, opts, saved){
  const reveal = saved && (saved.ok || saved.tries>=2);
  return opts.map((o,i)=>{
    let cls = "opt";
    if(saved && saved.picked!==undefined){
      if(reveal && i===saved.correctIdx) cls += " right";
      else if(i===saved.picked && !saved.ok) cls += " wrong";
    }
    return "<button class='"+cls+"' data-q='"+id+"' data-i='"+i+"'"+((saved&&saved.ok)?" disabled":"")+
           "><span class='k'>"+L[i]+"</span>"+o+"</button>";
  }).join("");
}
function qBlock(id, num, stem, ctx, opts, correctIdx, why, ar){
  const a = st.ans[id];
  let h = "<div class='qcard' id='card-"+id+"' data-correct='"+correctIdx+"'>";
  h += "<div class='qnum'>"+num+"</div><div class='stem'>"+stem+"</div>";
  if(ctx) h += "<div class='ctx'>"+ctx+"</div>";
  h += "<div class='opts'>"+optionsHTML(id,opts,a?{picked:a.picked,ok:a.ok,tries:a.tries,correctIdx}:null)+"</div>";
  let fb = "";
  if(a && a.ok) fb = "<b>Correct</b>"+why;
  else if(a && a.tries>=2) fb = "<b>Not that one either — here is the thinking</b>"+why;
  else if(a) fb = "<b>Not quite</b>Read the words on either side of it once more, then choose again.";
  h += "<div class='fb "+(a&&a.ok?"good":"bad")+(a?" show":"")+"'>"+fb+"</div>";
  if(ar) h += "<div class='ar"+(arabic?" show":"")+"'>"+ar+"</div>";
  return h + "</div>";
}
function onAnswer(btn){
  const id = btn.dataset.q, i = +btn.dataset.i;
  const correct = +btn.closest(".qcard").dataset.correct;
  const prev = st.ans[id] || {tries:0};
  if(prev.ok) return;
  const ok = i === correct;
  st.ans[id] = { picked:i, ok, tries:prev.tries+1 };
  if(ok) burst(10);
  render();
  const c = document.getElementById("card-"+id);
  if(c && c.scrollIntoView) c.scrollIntoView({block:"nearest"});
}

function wireHighlighter(){
  const box = $("#passage"); if(!box) return;
  const on = $("#hlOn");
  if(on) on.onclick = () => {
    const sel = window.getSelection();
    if(!sel || sel.isCollapsed || sel.rangeCount===0) return;
    const r = sel.getRangeAt(0);
    if(!box.contains(r.commonAncestorContainer)) return;
    try{
      const m = document.createElement("mark"); m.className="hl";
      m.appendChild(r.extractContents()); r.insertNode(m);
      sel.removeAllRanges();
    }catch(e){ /* selection spans elements — ignore, text is never altered */ }
  };
  const cl = $("#hlClear");
  if(cl) cl.onclick = () => {
    Array.from(box.querySelectorAll("mark.hl")).forEach(m=>{
      const t = document.createTextNode(m.textContent);
      m.parentNode.replaceChild(t, m);
    });
    box.normalize();
  };
}

function explainHTML(){
  const par = DATA[pIdx];
  let h = phaseHead(2);
  h += "<div class='phead'><p class='kicker'>Paragraph "+par.tag+" of "+DATA.length+"</p><h2>"+esc(par.label)+"</h2></div>";
  h += "<div class='stages'>"+STAGES.map((s,i)=>
       "<button class='stg"+(i===stage?" active":"")+(stageDone(pIdx,i)?" ok":"")+"' data-s='"+i+"'>"+(i+1)+". "+s+"</button>").join("")+"</div>";
  h += "<div class='body'>";

  if(stage===0){
    h += "<p class='instr'><b>Read it twice.</b> Once straight through with no stopping. Then again, asking one question only: what job is this paragraph doing in the passage?</p>";
    h += "<div class='passage'>"+esc(par.text)+"</div>";
    const mine = st.text["job-"+pIdx];
    if(mine) h += "<div class='mypred' style='margin-top:14px'><b>WHAT YOUR PAIR WROTE IN EXPLORE</b>"+esc(mine)+"</div>";
    h += "<div style='height:6px'></div><p class='hint'>Talk about it with your partner and your teacher first. Only then press the button.</p>";
    if(st.opened["job-"+pIdx]){
      h += "<div class='fb good show'><b>What this paragraph is doing</b>"+par.job+"</div>";
    } else {
      h += "<button class='btn amber' id='showJob'>Show me what this paragraph is doing</button>";
    }
  }

  if(stage===1){
    h += "<p class='instr'><b>Say it in simple English first.</b> Read each sentence, say your own simple version out loud, then open the card and compare. Keep the careful words &mdash; if you drop them, you change the meaning.</p>";
    par.sents.forEach((s,i)=>{
      const open = st.opened["s-"+pIdx+"-"+i];
      h += "<div class='scard"+(open?" open":"")+"'><div class='orig'>"+esc(s.o)+"</div>";
      h += "<div class='rev'><span class='lab'>IN SIMPLE ENGLISH</span><p class='simple'>"+esc(s.s)+"</p><p class='note'>"+s.n+"</p></div>";
      if(!open) h += "<button class='mini' data-open='s-"+pIdx+"-"+i+"'>Compare with a simple version</button>";
      h += "</div>";
    });
  }

  if(stage===2){
    h += "<p class='instr'><b>No dictionary.</b> Look at the words on either side, make a guess, then choose. Afterwards, tell your partner which clue helped you.</p>";
    par.vocab.forEach((v,i)=>{
      h += qBlock(key(pIdx,"v",i), "WORD "+(i+1), "What does <b>"+esc(v.w)+"</b> mean here?",
                  esc(v.ctx), v.o, v.a, v.why, v.ar);
    });
  }

  if(stage===3){
    h += "<p class='instr'><b>What is the writer really saying?</b> Understanding every word is not enough here. Look at how strong the claim is, and who is making it.</p>";
    const v = par.infer;
    h += qBlock(key(pIdx,"i"), "BETWEEN THE LINES", esc(v.q), esc(v.stem), v.o, v.a, v.why, null);
  }

  if(stage===4){
    h += "<p class='instr'><b>Now check yourself.</b> You may look back at the paragraph &mdash; this is practice, not a test.</p>";
    par.checks.forEach((c,i)=>{
      h += qBlock(key(pIdx,"c",i), "CHECK "+(i+1), esc(c.q), null, c.o, c.a, c.why, null);
    });
    if(paraDone(pIdx)) h += "<div class='fb good show'><b>Paragraph "+par.tag+" is dissected</b>Now you can explain this paragraph to another pair. That is the real test.</div>";
  }

  h += "</div>";
  h += "<div class='navrow'>";
  h += "<button class='btn ghost' id='prevStage'"+(stage===0&&pIdx===0?" disabled":"")+">&larr; Back</button>";
  h += "<span class='sp'></span><span class='hint'>Stage "+(stage+1)+" of 5</span><span class='sp'></span>";
  h += "<button class='btn' id='nextStage'>"+(stage<4?"Next stage &rarr;":(pIdx<DATA.length-1?"Next paragraph &rarr;":"Go to Extend &rarr;"))+"</button>";
  h += "</div>";
  return h;
}

/* ============================================================
   5 EVALUATE
   ============================================================ */
function stageScore(s){
  let got=0, tot=0;
  DATA.forEach((par,p)=>{
    if(s===2) par.vocab.forEach((_,i)=>{ tot++; const a=st.ans[key(p,"v",i)]; if(a&&a.ok&&a.tries===1) got++; });
    if(s===3){ tot++; const a=st.ans[key(p,"i")]; if(a&&a.ok&&a.tries===1) got++; }
    if(s===4) par.checks.forEach((_,i)=>{ tot++; const a=st.ans[key(p,"c",i)]; if(a&&a.ok&&a.tries===1) got++; });
    if(s===0){ tot++; if(st.opened["job-"+p]) got++; }
    if(s===1) par.sents.forEach((_,i)=>{ tot++; if(st.opened["s-"+p+"-"+i]) got++; });
  });
  return {got, tot, pc: tot? Math.round(got/tot*100):0};
}

  "<tr><th>Stage</th><th>What you do</th><th>Why it helps in the exam</th></tr>"+
  "<tr><td>1. Read it</td><td>Read the paragraph twice without stopping, say what job it does, then check.</td><td>Matching Headings depends on knowing a paragraph's purpose, not its details.</td></tr>"+
  "<tr><td>2. Break it down</td><td>Turn each long sentence into simple English, then compare with the version given.</td><td>Long sentences are where most Band 5&ndash;6 readers lose the meaning.</td></tr>"+
  "<tr><td>3. Guess the word</td><td>Work out a difficult word from the words around it.</td><td>There is no dictionary in the exam, and every passage has words you have never seen.</td></tr>"+
  "<tr><td>4. Read between the lines</td><td>Decide what a sentence implies and how strong the claim is.</td><td>True / False / Not Given is decided by exactly this.</td></tr>"+
  "<tr><td>5. Check yourself</td><td>Answer two questions with the paragraph still in front of you.</td><td>Mistakes get fixed here instead of spreading into the next paragraph.</td></tr>"+
  "</table>"+
  "<h3 style='margin:22px 0 6px'>The five phases across the top</h3>"+
  "<p>The tabs follow the lesson: <b>Engage</b> (words you already know), <b>Explore</b> (read once, decide what each paragraph does), <b>Explain</b> (the dissection), <b>Extend</b> (build the system, apply it here), <b>Evaluate</b> (what you can do and what is next). You can move between them freely.</p>"+
  "<h3 style='margin:22px 0 6px'>For the teacher</h3>"+
  "<p>Seven paragraphs, five stages each, 35 scored items. In a 60-minute lesson, give each pair one paragraph in Explain and have them teach it to the class &mdash; do not try to dissect all seven with the whole group. "+
  "Students press <b>Save</b> to download a JSON file containing their writing, answers and self-ratings; collect those to see the class pattern. The reading test this prepares them for is the List 5 reading paper on this same passage.</p>"+
  "<p class='hint'>Points: 10 for a first-try answer, 6 on the second try, 3 after that, and 5 for each step of the fee chain placed in the right order.</p>"+
  "</div>";
}

/* ============================================================
   RENDER + WIRE
   ============================================================ */
function renderPanel(){
  const p = $("#panel");
  if(view===0) p.innerHTML = engageHTML();
  else if(view===1) p.innerHTML = exploreHTML();
  else if(view===2) p.innerHTML = explainHTML();
  else if(view===3) p.innerHTML = extendHTML();
  else if(view===4) p.innerHTML = evaluateHTML();
  else p.innerHTML = helpHTML();
  wirePanel();
}
function wirePanel(){
  $$("[data-go]").forEach(b=>b.onclick=()=>{ view=+b.dataset.go; window.scrollTo(0,0); render(); });
  $$("textarea[data-t]").forEach(t=>{
    t.oninput = () => { st.text[t.dataset.t] = t.value; };
    t.onblur  = () => { renderHeader(); };
  });
  $$("[data-g]").forEach(b=>b.onclick=()=>{
    const i = +b.dataset.g, at = st.goals.indexOf(i);
    if(at>=0) st.goals.splice(at,1); else st.goals.push(i);
    render();
  });
  wireHighlighter();
  const sj = $("#showJob"); if(sj) sj.onclick = () => { st.opened["job-"+pIdx] = true; render(); };
  $$("[data-open]").forEach(b=>b.onclick=()=>{ st.opened[b.dataset.open]=true; render(); });
  $$(".opt").forEach(b=>b.onclick=()=>onAnswer(b));
  $$(".stg").forEach(b=>b.onclick=()=>{ stage=+b.dataset.s; render(); });
  const ps = $("#prevStage"); if(ps) ps.onclick = () => {
    if(stage>0) stage--; else if(pIdx>0){ pIdx--; stage=4; }
    window.scrollTo(0,0); render();
  };
  const ns = $("#nextStage"); if(ns) ns.onclick = () => {
    if(stage<4) stage++;
    else if(pIdx<DATA.length-1){ pIdx++; stage=0; }
    else { view=3; }
    window.scrollTo(0,0); render();
  };
  $$("[data-dg]").forEach(b=>b.onclick=()=>{
    const i = +b.dataset.dg;
    if(i === st.dg){ st.dg++; burst(8); render(); }
    else {
      b.classList.add("wrong");
      const box = b.closest(".dgwrap");
      let w = box.querySelector(".fb.dgfb");
      if(!w){ w = document.createElement("div"); w.className="fb bad show dgfb"; box.parentNode.insertBefore(w, box.nextSibling); }
      w.innerHTML = "<b>Not next</b>Read paragraph D again and follow the money: what happens after "+
        (st.dg===0?"the customer decides to pay?":DIAGRAM[st.dg-1].short+"?");
    }
  });
  $$("[data-self]").forEach(b=>b.onclick=()=>{ st.self[+b.dataset.self] = +b.dataset.n; render(); });
  const ni = $("#nameIn"); if(ni) ni.oninput = () => { st.text.name = ni.value; };
  const pc = $("#printCert"); if(pc) pc.onclick = () => {
    document.body.classList.add("certonly"); window.print();
    setTimeout(()=>document.body.classList.remove("certonly"), 400);
  };
  const s2 = $("#saveBtn2"); if(s2) s2.onclick = saveFile;
}
function render(){ renderHeader(); renderSide(); renderPanel(); }

/* ---------- confetti ---------- */
function burst(n){
  const cols = ["#C08A2B","#5C3A6B","#2A6B55","#2E1B33"];
  for(let i=0;i<n;i++){
    const d = document.createElement("div");
    d.className = "conf";
    d.style.left = Math.random()*100+"vw";
    d.style.background = cols[i%cols.length];
    d.style.animation = "fall "+(1.5+Math.random()*1.2)+"s linear forwards";
    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 3000);
  }
}

/* ---------- save / load ---------- */
function saveFile(){
  const blob = new Blob([JSON.stringify({app:APP_ID, v:1, st, arabic}, null, 1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const nm = (st.text.name||"").trim().replace(/[^A-Za-z0-9 _-]/g,"").replace(/\s+/g,"-");
  a.download = APP_ID + (nm?"-"+nm:"") + ".json";
  document.body.appendChild(a); a.click(); a.remove();
}
function loadFile(f){
  const r = new FileReader();
  r.onload = e => {
    try{
      const o = JSON.parse(e.target.result);
      if(o.app && o.app !== APP_ID){ alert("That file is from a different app. Please choose the file saved from this page."); return; }
      if(o.st){
        st.ans = o.st.ans||{}; st.opened = o.st.opened||{}; st.text = o.st.text||{};
        st.goals = o.st.goals||[]; st.self = o.st.self||{}; st.dg = o.st.dg||0;
      }
      arabic = !!o.arabic; setAr(); render();
    }catch(err){ alert("That file could not be read."); }
  };
  r.readAsText(f);
}
function setAr(){
  const b = $("#arBtn");
  b.textContent = arabic ? "العربية ON" : "العربية OFF";
  b.classList.toggle("on", arabic);
}

/* ---------- boot ---------- */
$$(".tab").forEach(t=>t.onclick=()=>{ view=+t.dataset.view; window.scrollTo(0,0); render(); });
$("#arBtn").onclick = () => { arabic = !arabic; setAr(); render(); };
$("#saveBtn").onclick = saveFile;
$("#loadBtn").onclick = () => $("#fileIn").click();
$("#fileIn").onchange = e => { if(e.target.files[0]) loadFile(e.target.files[0]); e.target.value=""; };
setAr();
render();
</script>
